# A pushed tag vX.Y.Z becomes a GitHub release: built on the Mac Ultra's runner, Folio-X.Y.Z.zip attached,
# the notes taken from CHANGELOG.md's "## [X.Y.Z]" section, marked pre-release below 1.0.0.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, ultra]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build and check (tests, bundle, signature, version)
        id: build
        run: tools/ci/build.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.build.outputs.version }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: |
          if [ "v$VERSION" != "$TAG" ]; then
            echo "The build says $VERSION, the tag is $TAG (tags are vX.Y.Z)"; exit 1
          fi
          tools/ci/changelog-section.sh "$VERSION" > build/release-notes.md
          prerelease=()
          case "$VERSION" in 0.*|*-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" "$ZIP" --verify-tag --title "Folio $VERSION" \
            --notes-file build/release-notes.md "${prerelease[@]}"
