<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folio control room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230C0E11'/%3E%3Cpath d='M6 9h7l2 2.5h11V24H6z' fill='none' stroke='%239BFF57' stroke-width='2'/%3E%3Ccircle cx='22' cy='18' r='2' fill='%239BFF57'/%3E%3C/svg%3E">
<script>
(function(){try{var d=document.documentElement;var t=localStorage.getItem('folio-d1-theme');d.setAttribute('data-theme',t==='light'?'light':'dark');var a=localStorage.getItem('folio-d1-accent');if(a==='amber'||a==='cyan')d.setAttribute('data-accent',a);}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=Chivo+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root{
  --mask:#000;
  --font-ui:'Archivo',ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:'Chivo Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --wd-head:124%; --wd-col:116%; --wd-body:100%;
  --r-win:10px; --r-panel:4px; --r-ctl:5px; --r-sm:3px; --r-dot:50%;
  --h-title:44px; --h-tool:56px; --h-hud:30px; --h-status:32px;
  --row-h:24px; --side-w:248px; --rail-w:34px;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in:cubic-bezier(.5,0,.9,.4);
  --acc-dark:#9BFF57; --acc-light:#2F7D1E;
  --blade-dark:#0C0E11; --blade-light:#F4F6F8;
}
:root[data-accent="amber"]{--acc-dark:#FFB347;--acc-light:#B45309}
:root[data-accent="cyan"]{--acc-dark:#5EC8E0;--acc-light:#0E7490}

:root,:root[data-theme="dark"]{
  color-scheme:dark;
  --desk:#050608;
  --bg:#0C0E11; --s1:#111419; --s2:#161A20; --s3:#1B2028;
  --line:rgba(201,209,219,.10); --line-2:rgba(201,209,219,.17); --line-3:rgba(201,209,219,.30);
  --txt:#C9D1DB; --txt2:#9BA6B3; --txt3:#838E9B;
  --accent:var(--acc-dark); --on-accent:#0C0E11;
  --ok:#9BFF57; --part:#FFB347; --miss:#FF5C5C;
  --fold-back:#262C35; --fold-front:#343C48; --fold-line:#5F6B79; --file-bg:#1C2229;
  --t-doc:#8FB4D9; --t-code:#E3C15C; --t-web:#5EC8E0; --t-data:#F0915F;
  --tl-close:#E2564F; --tl-min:#D8A436; --tl-zoom:#4DB04A;
  --hud-bg:#08090C; --hud-line:rgba(201,209,219,.12); --hud-txt:#C9D1DB; --hud-txt2:#8E99A6; --hud-acc:var(--acc-dark);
  --sw-green:#9BFF57; --sw-amber:#FFB347; --sw-cyan:#5EC8E0;
  --scrim:rgba(4,5,7,.62);
  --e3:0 12px 32px rgba(0,0,0,.55);
  --e5:0 30px 90px rgba(0,0,0,.7);
  --e-win:0 30px 90px rgba(0,0,0,.6);
  --glow:0 0 9px;
  --grid-a:8%; --grid-b:3.6%;
  --sel-bg:color-mix(in oklab,var(--accent) 13%,transparent);
  --mark-bg:color-mix(in oklab,var(--accent) 24%,transparent);
  --focus:var(--accent);
}
:root[data-theme="light"]{
  color-scheme:light;
  --desk:#D3D9DF;
  --bg:#F4F6F8; --s1:#FFFFFF; --s2:#F9FAFB; --s3:#FFFFFF;
  --line:rgba(28,44,62,.11); --line-2:rgba(28,44,62,.19); --line-3:rgba(28,44,62,.34);
  --txt:#2A3441; --txt2:#48535F; --txt3:#5B6672;
  --accent:var(--acc-light); --on-accent:#FFFFFF;
  --ok:#2F7D1E; --part:#B45309; --miss:#C81E1E;
  --fold-back:#D2DAE2; --fold-front:#E6ECF1; --fold-line:#7A8796; --file-bg:#FFFFFF;
  --t-doc:#3B6E9E; --t-code:#97700A; --t-web:#0E7490; --t-data:#B4501F;
  --tl-close:#EC5F57; --tl-min:#E5AE36; --tl-zoom:#3DB24A;
  --hud-bg:#1A1F26; --hud-line:rgba(201,209,219,.14); --hud-txt:#DCE2E9; --hud-txt2:#A3ADB9; --hud-acc:var(--acc-dark);
  --sw-green:#2F7D1E; --sw-amber:#B45309; --sw-cyan:#0E7490;
  --scrim:rgba(26,31,38,.34);
  --e3:0 12px 28px rgba(28,44,62,.16),0 1px 2px rgba(28,44,62,.08);
  --e5:0 28px 70px rgba(28,44,62,.28);
  --e-win:0 30px 80px rgba(28,44,62,.25);
  --glow:0 0 0;
  --grid-a:11%; --grid-b:5%;
  --sel-bg:color-mix(in oklab,var(--accent) 12%,transparent);
  --mark-bg:color-mix(in oklab,var(--accent) 20%,transparent);
  --focus:var(--accent);
}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--txt);font:400 13px/1.35 var(--font-ui);font-stretch:var(--wd-body);overflow:hidden;-webkit-font-smoothing:antialiased;font-style:normal}
em,i,cite,var,dfn,address{font-style:normal}
button,input{font:inherit;color:inherit}
button{background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:not-allowed}
input{border:0;outline:0;background:none}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12px}
.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grow{flex:1 1 auto}
kbd,.kbd{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:1px solid var(--line-3);border-bottom-width:2px;border-radius:var(--r-sm);font:500 12px/1 var(--font-mono);color:var(--txt);background:var(--s2)}

/* state layers + press */
.sl{position:relative;isolation:isolate}
.sl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity 90ms linear;pointer-events:none;z-index:-1}
.sl:hover::after{opacity:.08}
.sl:focus-visible::after{opacity:.10}
.sl:active::after{opacity:.14}
.sl:disabled::after{opacity:0}
.press{transition:transform 70ms var(--ease-out)}
.press:active:not(:disabled){transform:scale(.95)}

/* corner brackets */
.brk::before,.hb::before,.row.sel::before,.ta::before,.cw::before,.ql-card::before,.mi.cur::before,.ta-row.hi::before{
  --bc:color-mix(in oklab,var(--accent) 70%,transparent); --bl:10px; --bw:1.5px;
  content:"";position:absolute;inset:-1px;pointer-events:none;z-index:2;
  background:
    linear-gradient(var(--bc),var(--bc)) 0 0/var(--bl) var(--bw),
    linear-gradient(var(--bc),var(--bc)) 0 0/var(--bw) var(--bl),
    linear-gradient(var(--bc),var(--bc)) 100% 0/var(--bl) var(--bw),
    linear-gradient(var(--bc),var(--bc)) 100% 0/var(--bw) var(--bl),
    linear-gradient(var(--bc),var(--bc)) 0 100%/var(--bl) var(--bw),
    linear-gradient(var(--bc),var(--bc)) 0 100%/var(--bw) var(--bl),
    linear-gradient(var(--bc),var(--bc)) 100% 100%/var(--bl) var(--bw),
    linear-gradient(var(--bc),var(--bc)) 100% 100%/var(--bw) var(--bl);
  background-repeat:no-repeat;
}
.hb::before{--bl:7px;opacity:0;transform:scale(1.12);transition:opacity 120ms,transform 160ms var(--ease-out)}
.hb:hover:not(:disabled)::before,.hb:focus-visible::before{opacity:1;transform:none}
.row.sel::before{--bc:var(--accent);--bl:7px;inset:0 3px}
.mi.cur::before{--bc:var(--accent);--bl:6px;inset:0 2px}
.ta-row.hi::before{--bc:var(--accent);--bl:6px;inset:0}

/* status lights */
.led{--lc:var(--accent);width:7px;height:7px;border-radius:var(--r-dot);background:var(--lc);flex:none;display:inline-block;
  box-shadow:0 0 0 2px color-mix(in oklab,var(--lc) 18%,transparent),var(--glow) color-mix(in oklab,var(--lc) 62%,transparent)}
.led.breathe{animation:breathe 3.2s ease-in-out infinite}
.led.pulse2{animation:dbl 1.6s linear infinite}
.led.blink{--lc:var(--part);animation:blink 1s steps(1,end) infinite}
.led.ok{--lc:var(--ok);animation:none}
.led.miss{--lc:var(--miss);animation:none}
.led.off{--lc:var(--line-3);box-shadow:none;animation:none}
.led.flash{animation:dbl1 .7s linear 1,breathe 3.2s ease-in-out .7s infinite}
@keyframes breathe{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes dbl{0%{opacity:.3}7%{opacity:1}14%{opacity:.3}21%{opacity:1}34%,100%{opacity:.3}}
@keyframes dbl1{0%{opacity:.3}18%{opacity:1}36%{opacity:.3}54%{opacity:1}100%{opacity:1}}
@keyframes blink{0%{opacity:1}50%{opacity:.18}}
.win.relight .led:not(.off){animation:dbl1 .7s linear 1}

/* ---------- desk + window ---------- */
.desk{height:100vh;display:grid;place-items:center;overflow:hidden}
.win{position:relative;width:min(1440px,100vw);height:min(900px,100vh);display:grid;
  grid-template-rows:var(--h-title) var(--h-tool) var(--h-hud) minmax(0,1fr) var(--h-status);
  background:var(--bg);border:1px solid var(--line-2);border-radius:var(--r-win);overflow:hidden;box-shadow:var(--e-win)}

/* title bar */
.titlebar{display:flex;align-items:center;gap:12px;padding:0 6px 0 14px;background:var(--bg);border-bottom:1px solid var(--line);min-width:0;user-select:none}
.tl{display:flex;gap:8px;flex:none}
.tl span{width:12px;height:12px;border-radius:var(--r-dot);display:block;box-shadow:inset 0 0 0 .5px var(--line-3)}
.tl .c{background:var(--tl-close)}.tl .m{background:var(--tl-min)}.tl .z{background:var(--tl-zoom)}
.brand{display:flex;align-items:center;gap:8px;padding:0 10px 0 6px;border-right:1px solid var(--line);height:22px;flex:none}
.brand svg{width:18px;height:18px}
.brand .bm-f{fill:none;stroke:var(--accent);stroke-width:1.6}
.brand .bm-d{fill:var(--accent)}
.brand b{font-weight:800;font-stretch:var(--wd-head);font-size:14px;letter-spacing:.01em}
.wtitle{display:flex;align-items:baseline;gap:12px;min-width:0;flex:1 1 auto;overflow:hidden;white-space:nowrap}
.wtitle b{font-size:14px;font-weight:700;font-stretch:var(--wd-head);overflow:hidden;text-overflow:ellipsis}
.wtitle .wpath{color:var(--txt3);overflow:hidden;text-overflow:ellipsis}
.tb-right{display:flex;align-items:center;gap:6px;flex:none}
.accents{display:flex;gap:6px;padding:0 6px;border-right:1px solid var(--line);margin-right:2px}
.acc{width:30px;height:44px;display:grid;place-items:center;border-radius:var(--r-ctl)}
.acc i{width:14px;height:14px;border-radius:var(--r-dot);display:block;box-shadow:0 0 0 1px var(--line-3);transition:box-shadow 140ms,transform 140ms var(--ease-out)}
.acc[data-acc="green"] i{background:var(--sw-green)}
.acc[data-acc="amber"] i{background:var(--sw-amber)}
.acc[data-acc="cyan"] i{background:var(--sw-cyan)}
.acc[aria-checked="true"] i{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--txt);transform:scale(1.05)}
.ibtn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-ctl);color:var(--txt2)}
.ibtn:hover{color:var(--txt)}
.ibtn .i{transition:transform 220ms var(--ease-out)}
.ibtn.spin .i{transform:rotate(180deg)}
.side-toggle{display:none}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--s1);border-bottom:1px solid var(--line);min-width:0}
.navs{display:flex;gap:2px;flex:none}
.nbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r-ctl);color:var(--txt);flex:none}
.nbtn:disabled{color:var(--txt);opacity:.34}
.addr-wrap{position:relative;flex:1 1 auto;min-width:0}
.addr{height:44px;display:flex;align-items:stretch;background:var(--s2);border:1px solid var(--line-2);border-radius:var(--r-ctl);position:relative;overflow:hidden;transition:border-color 140ms}
.addr:hover{border-color:var(--line-3)}
.addr.mode-address{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab,var(--accent) 16%,transparent)}
.a-ico{display:grid;place-items:center;width:40px;flex:none;color:var(--txt2)}
.crumbs{display:flex;align-items:stretch;justify-content:flex-end;min-width:0;flex:0 1 auto;overflow:hidden}
.crumbs.clip{-webkit-mask-image:linear-gradient(90deg,transparent,var(--mask) 22px);mask-image:linear-gradient(90deg,transparent,var(--mask) 22px)}
.cr,.cr-arrow{flex:none;display:flex;align-items:center;height:42px;font:500 13px/1 var(--font-mono);color:var(--txt);white-space:nowrap}
.cr{padding:0 8px;border-radius:var(--r-sm)}
.cr.cur{color:var(--accent);font-weight:600}
.cr-arrow{width:30px;justify-content:center;color:var(--txt3);border-radius:var(--r-sm)}
.cr-arrow .i{width:14px;height:14px;transition:transform 160ms var(--ease-out)}
.cr-arrow.open{color:var(--accent)}
.cr-arrow.open .i{transform:rotate(90deg)}
.addr-hit{flex:1 1 40px;min-width:40px;height:42px;cursor:text;position:relative}
.addr-hit:focus-visible{outline-offset:-3px}
.addr-in{flex:1;min-width:0;height:42px;padding:0 12px 0 0;font:500 13px/1 var(--font-mono);color:var(--txt);caret-color:var(--accent)}
.addr-in:focus-visible,.search input:focus-visible{outline:none}
.addr-in::selection{background:var(--mark-bg)}
.addr.typing .addr-in{caret-color:transparent}
.addr.typing::after{content:"";position:absolute;top:13px;bottom:13px;width:8px;left:var(--cx,40px);background:var(--accent);opacity:.85}
.addr-label{display:block;line-height:42px;font:600 13px/42px var(--font-ui);font-stretch:var(--wd-col);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;padding-right:12px}
.sfill{position:absolute;inset:0;background:color-mix(in oklab,var(--accent) 10%,transparent);transform-origin:left;transform:scaleX(var(--p,0));pointer-events:none;transition:opacity .6s}
.sfill.done{opacity:0}
.sprog{position:absolute;left:0;right:0;bottom:0;height:2px;pointer-events:none}
.sprog i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transform:scaleX(var(--p,0))}
.sprog::after{content:"";position:absolute;top:-2px;width:6px;height:6px;border-radius:var(--r-dot);left:calc(var(--p,0) * 100% - 3px);background:var(--accent);box-shadow:var(--glow) var(--accent)}
.sprog.done i{opacity:.45;transition:opacity .6s}
.sprog.done::after{opacity:0;transition:opacity .4s}
.search{width:280px;height:44px;flex:none;display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;background:var(--s2);border:1px solid var(--line-2);border-radius:var(--r-ctl);color:var(--txt2);cursor:text;transition:border-color 140ms,width 200ms var(--ease-out)}
.search:hover{border-color:var(--line-3)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;height:40px;color:var(--txt);font-size:13px}
.search input::placeholder{color:var(--txt3)}
.q-clear{width:32px;height:32px;display:none;place-items:center;border-radius:var(--r-sm);color:var(--txt2)}
.search.has .q-clear{display:grid}
.q-clear .i{width:15px;height:15px}

/* typeahead */
.ta{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--s3);border:1px solid var(--line-2);border-radius:var(--r-panel);box-shadow:var(--e3);padding:0 0 4px}
.ta[hidden]{display:none}
.ta::before{--bc:var(--accent)}
.ta-h{display:flex;align-items:center;justify-content:space-between;height:32px;padding:0 12px;border-bottom:1px solid var(--line);color:var(--txt2)}
.ta-h .k{font:650 12px/1 var(--font-ui);font-stretch:var(--wd-col)}
.ta-list{padding:4px}
.ta-row{display:flex;align-items:center;gap:10px;width:100%;height:32px;padding:0 10px;border-radius:var(--r-sm);color:var(--txt2);position:relative}
.ta-row .led{opacity:0;width:6px;height:6px}
.ta-row.hi{background:var(--sel-bg);color:var(--txt)}
.ta-row.hi .led{opacity:1}
.ta-t{font-size:13px;white-space:nowrap;display:flex;min-width:0}
.ta-dir{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
.ta-leaf{flex:none}
.ta-t b{font-weight:600;color:var(--txt)}
.ta-row.hi .ta-t b{color:var(--accent)}
.ta-f{display:block;padding:9px 12px 5px;line-height:26px;border-top:1px solid var(--line);color:var(--txt2)}
.ta-f kbd,.ta-f .kbd{vertical-align:middle;margin-right:2px}
.ta-f .kbd{cursor:pointer;height:24px}
.ta-f .kbd:hover{border-color:var(--accent);color:var(--accent)}
.ta-empty{padding:14px 12px;color:var(--txt2)}

/* HUD strip */
.hud{display:flex;align-items:stretch;background:var(--hud-bg);color:var(--hud-txt);border-bottom:1px solid var(--line);font:500 12px/1 var(--font-mono);overflow:hidden;white-space:nowrap;position:relative;min-width:0;
  background-image:repeating-linear-gradient(90deg,var(--hud-line) 0 1px,transparent 1px 8px);background-size:100% 4px;background-repeat:no-repeat;background-position:0 100%}
.seg{display:flex;align-items:center;gap:8px;padding:0 14px;border-right:1px solid var(--hud-line);flex:none}
.seg .k{font:600 12px/1 var(--font-ui);font-stretch:var(--wd-col);color:var(--hud-txt2)}
.seg .v{color:var(--hud-acc)}
.seg .led{--lc:var(--hud-acc)}
.seg.r{margin-left:auto;border-right:0;border-left:1px solid var(--hud-line);min-width:0;flex:0 1 auto;overflow:hidden}
.seg.r .v{overflow:hidden;text-overflow:ellipsis}

/* body */
.body{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) var(--rail-w);min-height:0;min-width:0}
.side{min-height:0;overflow:auto;padding:12px 10px;border-right:1px solid var(--line);background-color:var(--bg);
  background-image:
    linear-gradient(color-mix(in oklab,var(--accent) var(--grid-a),transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in oklab,var(--accent) var(--grid-a),transparent) 1px,transparent 1px),
    linear-gradient(color-mix(in oklab,var(--accent) var(--grid-b),transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in oklab,var(--accent) var(--grid-b),transparent) 1px,transparent 1px);
  background-size:64px 64px,64px 64px,16px 16px,16px 16px;background-position:-1px -1px;scrollbar-width:thin}
.sgrp{position:relative;background:color-mix(in oklab,var(--bg) 86%,transparent);border:1px solid var(--line);border-radius:var(--r-panel);margin-bottom:12px}
.sgrp::before{--bc:color-mix(in oklab,var(--accent) 55%,transparent);--bl:8px}
.sh{display:flex;align-items:center;gap:8px;width:100%;height:36px;padding:0 10px;color:var(--txt2);border-radius:var(--r-panel)}
.sh span:first-of-type{font:700 12px/1 var(--font-ui);font-stretch:var(--wd-head);letter-spacing:.04em;color:var(--txt)}
.sh .i{width:16px;height:16px}
.sh .chev{margin-left:auto;transition:transform 180ms var(--ease-out)}
.sgrp.shut .sh .chev{transform:rotate(-90deg)}
.sh .n{color:var(--txt3)}
.sbody{display:grid;grid-template-rows:1fr;transition:grid-template-rows 220ms var(--ease-out)}
.sgrp.shut .sbody{grid-template-rows:0fr}
.sbody>div{overflow:hidden;min-height:0;padding:0 4px}
.sgrp:not(.shut) .sbody>div{padding-bottom:6px}
.si{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 8px;border-radius:var(--r-sm);color:var(--txt);white-space:nowrap}
.si .led{opacity:0;width:6px;height:6px}
.si .i{width:16px;height:16px;color:var(--txt2)}
.si-t{overflow:hidden;text-overflow:ellipsis}
.si-t .dim{color:var(--txt3)}
.si.on{background:var(--sel-bg)}
.si.on .led{opacity:1}
.si.on .si-t,.si.on .i{color:var(--accent)}
.vol{display:block;width:100%;padding:8px 8px 10px;border-radius:var(--r-sm);text-align:left}
.vol-top{display:flex;align-items:center;gap:10px}
.vol-top .i{width:16px;height:16px;color:var(--txt2)}
.vol-top b{font-weight:600}
.vol-top .mono{margin-left:auto;color:var(--accent)}
.segbar{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;height:10px;margin:9px 0 7px}
.segbar i{display:block;border-radius:1px;background:var(--line-2)}
.segbar i.on{background:var(--accent);box-shadow:var(--glow) color-mix(in oklab,var(--accent) 50%,transparent)}
.segbar i.on.last{animation:breathe 3.2s ease-in-out infinite}
.vol-sub{display:flex;justify-content:space-between;color:var(--txt2)}

/* main + panes */
.main{display:grid;min-width:0;min-height:0}
.step{grid-area:1/1;display:flex;flex-direction:column;min-height:0;min-width:0}
.step[hidden]{display:none!important}
.pane{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;margin:8px 0 8px 8px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden}
.pane::before{--bl:12px}
.pane[data-kind="b"]{--cols:minmax(0,1fr) 150px 132px 88px}
.pane[data-kind="s"]{--cols:minmax(0,1fr) 140px 92px 80px minmax(0,1.25fr)}
.lh,.row{display:grid;grid-template-columns:var(--cols);column-gap:14px;padding:0 14px 0 10px}
.lh{height:32px;flex:none;border-bottom:1px solid var(--line);background:var(--s2)}
.hc{display:flex;align-items:center;gap:6px;height:32px;font:650 12px/1 var(--font-ui);font-stretch:var(--wd-col);letter-spacing:.02em;color:var(--txt2);position:relative;white-space:nowrap;min-width:0}
.hc::after{inset:4px -6px}
.hc-name{padding-left:16px}
.hc-size{justify-content:flex-end}
.hc.on{color:var(--accent)}
.hc>span{position:relative}
.hc.on>span::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:2px;background:var(--accent);box-shadow:var(--glow) color-mix(in oklab,var(--accent) 60%,transparent)}
.hc .sa{width:14px;height:14px;opacity:0;transition:transform 200ms var(--ease-out),opacity 120ms}
.hc.on .sa{opacity:1}
.hc.on.dn .sa{transform:rotate(180deg)}
.list{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 0;user-select:none;scrollbar-width:thin;scrollbar-color:var(--line-3) transparent}
.list:focus-visible{outline:none}
.pane:has(.list:focus-visible){border-color:color-mix(in oklab,var(--accent) 45%,transparent)}
.row{height:var(--row-h);align-items:center;position:relative;cursor:default;transition:opacity 200ms,transform 200ms var(--ease-out)}
.row::after{content:"";position:absolute;inset:0 3px;background:var(--txt);opacity:0;pointer-events:none;border-radius:var(--r-sm);transition:opacity 80ms}
.row:hover::after{opacity:.055}
.row:active::after{opacity:.1}
.row.sel{background:linear-gradient(var(--sel-bg),var(--sel-bg)) 3px 0/calc(100% - 6px) 100% no-repeat}
.row.sel .nm{color:var(--accent);font-weight:600}
.row.lock::before{animation:lockon .3s var(--ease-out)}
@keyframes lockon{from{opacity:0;transform:scale(1.03,1.5)}to{opacity:1;transform:none}}
.row.pend{opacity:0;transform:translateY(4px)}
.c{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-name{display:flex;align-items:center;gap:8px}
.nm{overflow:hidden;text-overflow:ellipsis;font-size:13px}
.nm mark{background:var(--mark-bg);color:inherit;border-radius:2px;padding:0 1px}
.c-date,.c-size,.c-type,.c-folder{color:var(--txt2)}
.c-size{text-align:right}
.c-folder{font-size:12px}
.row .led{width:6px;height:6px;opacity:0}
.row.sel .led{opacity:1;animation:breathe 3.2s ease-in-out infinite}
.row.sel.lock .led{animation:dbl1 .7s linear 1,breathe 3.2s ease-in-out .7s infinite}
.ren{height:22px;min-width:0;flex:1;padding:0 6px;background:var(--s3);border:1px solid var(--accent);border-radius:var(--r-sm);font-size:13px;color:var(--txt)}
.pane.dim{opacity:.55}
.scan{position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent);box-shadow:0 0 14px 2px color-mix(in oklab,var(--accent) 45%,transparent);opacity:0;pointer-events:none;z-index:3}

/* file + folder icons */
.fi{width:18px;height:15px;flex:none;overflow:visible}
.fi .fb{fill:var(--fold-back);stroke:var(--fold-line);stroke-width:.9}
.fi .ft{fill:var(--accent)}
.fi .ff{fill:var(--fold-front);stroke:var(--fold-line);stroke-width:.9}
.fi .fl{stroke:var(--fold-line);stroke-width:1.4;stroke-linecap:round}
.row.sel .fi .fl,.ta-row.hi .fi .fl,.si.on .fi .fl,.mi.cur .fi .fl{stroke:var(--accent)}
.fi.file{width:15px;height:15px}
.fi .pg{fill:var(--file-bg);stroke:var(--fold-line);stroke-width:.9}
.fi .pf{fill:none;stroke:var(--fold-line);stroke-width:.9}
.fi .pb{fill:var(--t-data)}
.fi.t-doc .pb{fill:var(--t-doc)}.fi.t-code .pb{fill:var(--t-code)}.fi.t-web .pb{fill:var(--t-web)}
.fi.big{width:72px;height:60px}
.fi.file.big{width:60px;height:60px}

/* empty states */
.empty{display:grid;place-items:center;align-content:center;gap:10px;height:100%;min-height:220px;padding:24px;text-align:center;color:var(--txt2)}
.empty .e-t{margin:0;font-size:15px;font-weight:700;font-stretch:var(--wd-head);color:var(--txt)}
.empty p{margin:0;max-width:44ch}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--line-3);font-weight:600;color:var(--txt);white-space:nowrap;flex:none}
.btn .i{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{background:var(--line-2);border-color:transparent;color:var(--txt2)}
.btn.warn{border-color:var(--miss);color:var(--miss)}
.btn.ghost{border-color:transparent;color:var(--txt2)}
.btn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--sel-bg)}

/* search options */
.opts{display:flex;align-items:center;gap:8px;margin:8px 0 0 8px;padding:6px 8px;min-height:50px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r-panel);flex:none;flex-wrap:wrap;position:relative}
.opts-k{font:700 12px/1 var(--font-ui);font-stretch:var(--wd-head);color:var(--txt2);padding:0 6px 0 4px;letter-spacing:.03em}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px;border-radius:var(--r-ctl);border:1px solid var(--line-2);color:var(--txt);font-size:13px;white-space:nowrap;position:relative}
.chip .i{width:15px;height:15px;color:var(--txt2)}
.chip .ck{display:none;color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--sel-bg);border-color:color-mix(in oklab,var(--accent) 60%,transparent);color:var(--txt)}
.chip[aria-pressed="true"] .ck{display:block}
.chip[aria-pressed="true"] .ic{display:none}
.chip .val{color:var(--accent);font-family:var(--font-mono);font-size:12px}
.seg2{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-ctl);overflow:hidden;flex:none}
.seg2 button{height:34px;padding:0 12px;font-size:13px;color:var(--txt2);white-space:nowrap}
.seg2 button+button{border-left:1px solid var(--line-2)}
.seg2 button[aria-checked="true"]{background:var(--sel-bg);color:var(--accent);font-weight:600}
.opts .seln{color:var(--txt2);padding:0 4px}

/* rail */
.rail{position:relative;border-left:1px solid var(--line);background:var(--bg);min-height:0;cursor:pointer}
.rail-in{position:absolute;inset:14px 0 14px 0}
.tick{position:absolute;right:6px;width:8px;height:1px;background:var(--line-3);display:block}
.tick.maj{width:13px}
.tick.on{background:var(--accent);height:2px;width:18px;box-shadow:var(--glow) var(--accent)}
.rail-win{position:absolute;left:3px;right:3px;border:1px solid transparent;transition:top 120ms linear,height 120ms linear;pointer-events:none}
.rail-win::before{--bl:5px;--bc:var(--txt3)}

/* status bar */
.status{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bg);border-top:1px solid var(--line);font-size:12px;color:var(--txt2);min-width:0;white-space:nowrap}
.st-count{display:flex;align-items:center;gap:9px;color:var(--txt);flex:none;font-weight:500;font-size:12px}
.st-sep{width:1px;height:14px;background:var(--line-2);flex:none}
.ticker{flex:1 1 auto;min-width:0;overflow:hidden;position:relative;height:20px;
  -webkit-mask-image:linear-gradient(90deg,transparent,var(--mask) 24px,var(--mask) calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,transparent,var(--mask) 24px,var(--mask) calc(100% - 24px),transparent)}
.tk-half{display:inline-flex;align-items:center;flex:none}
.tk-track{display:inline-flex;align-items:center;height:20px;gap:0;animation:tick var(--tk-dur,40s) linear infinite;will-change:transform}
.ticker:hover .tk-track{animation-play-state:paused}
.tk{display:inline-flex;align-items:center;gap:8px;padding:0 18px 0 0;font-family:var(--font-mono);font-size:12px;color:var(--txt2)}
.tk::before{content:"";width:5px;height:5px;transform:rotate(45deg);background:var(--accent);opacity:.7;flex:none}
.tk b{font-weight:500;color:var(--txt)}
@keyframes tick{to{transform:translateX(-50%)}}

/* overlays inside the window */
.scrim{position:absolute;left:0;right:0;top:var(--h-title);bottom:0;background:var(--scrim);z-index:40}
.menu{position:absolute;z-index:60;min-width:220px;max-width:340px;max-height:360px;overflow:auto;padding:4px;background:var(--s3);border:1px solid var(--line-2);border-radius:var(--r-panel);box-shadow:var(--e3);scrollbar-width:thin}
.menu[hidden]{display:none}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:30px;padding:0 10px;border-radius:var(--r-sm);font:500 13px/1 var(--font-mono);color:var(--txt);white-space:nowrap;position:relative}
.mi span{overflow:hidden;text-overflow:ellipsis}
.mi.cur{background:var(--sel-bg);color:var(--accent)}
.mi:focus-visible{outline-offset:-2px}
.mi-empty{padding:10px 12px;margin:0;color:var(--txt2)}
.tip{position:fixed;z-index:2147482500;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--hud-bg);color:var(--hud-txt);border:1px solid var(--hud-line);border-radius:var(--r-sm);font-size:12px;box-shadow:var(--e3);opacity:0;transform:translateY(-3px);transition:opacity 120ms,transform 120ms var(--ease-out);white-space:nowrap}
.tip.on{opacity:1;transform:none}
.tip kbd{background:transparent;color:var(--hud-acc);border-color:var(--hud-line);height:18px}
.tip .plus{color:var(--hud-txt2)}

/* quick look */
.ql{position:absolute;left:0;right:0;top:var(--h-title);bottom:0;z-index:50;display:grid;place-items:center;background:var(--scrim)}
.ql[hidden]{display:none}
.ql-card{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center;width:min(520px,calc(100% - 24px));padding:24px;background:var(--s2);border:1px solid var(--line-2);border-radius:var(--r-panel);box-shadow:var(--e5)}
.ql-card::before{--bc:var(--accent)}
.ql-card h3{margin:0 0 10px;font-size:18px;font-weight:700;font-stretch:var(--wd-head);word-break:break-all}
.ql-card dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;margin:0}
.ql-card dt{color:var(--txt2);font-size:12px;font-weight:600;font-stretch:var(--wd-col)}
.ql-card dd{margin:0;font-family:var(--font-mono);font-size:12px;overflow-wrap:anywhere}
.ql-hint{grid-column:1/-1;margin:0;color:var(--txt2);display:flex;gap:6px;align-items:center}

/* copy window */
.cw{position:absolute;z-index:45;left:50%;top:calc(50% + var(--h-title) / 2);transform:translate(-50%,-50%);width:min(680px,calc(100% - 24px));max-height:calc(100% - var(--h-title) - 24px);overflow:auto;background:var(--s2);border:1px solid var(--line-2);border-radius:var(--r-panel);box-shadow:var(--e5);scrollbar-width:thin}
.cw::before{--bc:var(--accent);--bl:14px;--bw:2px;inset:0}
.cw-h{display:flex;align-items:center;gap:12px;height:52px;padding:0 8px 0 18px;border-bottom:1px solid var(--line);background:var(--s1)}
.cw-h h2{margin:0;font-size:16px;font-weight:750;font-stretch:var(--wd-head);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cw-h .led{width:9px;height:9px}
.cw-body{padding:18px 18px 16px}
.cw-main{display:grid;grid-template-columns:168px minmax(0,1fr);gap:22px;align-items:center}
.ring{position:relative;width:168px;height:168px}
.ring svg{width:100%;height:100%;display:block}
.r-ticks{fill:none;stroke:var(--line-3);stroke-width:5;stroke-dasharray:1.2 6.654}
.r-track{fill:none;stroke:var(--line-2);stroke-width:10}
.r-prog{fill:none;stroke:var(--accent);stroke-width:10;stroke-dasharray:389.557;stroke-dashoffset:389.557}
.r-cut{fill:none;stroke:var(--s2);stroke-width:12;stroke-dasharray:1.6 8.139}
.r-head{fill:var(--accent)}
.ring.miss .r-prog,.ring.miss .r-head{stroke:var(--miss);fill:var(--miss)}
.ring.miss .r-prog{fill:none}
.ring.part .r-prog{stroke:var(--part)}.ring.part .r-head{fill:var(--part)}
.r-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:4px}
.r-pct{font-size:36px;line-height:1;font-weight:750;font-stretch:125%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.r-sub{color:var(--txt2)}
.route{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.rt{min-width:0;display:grid;gap:3px}
.rt .k,.rd .k{font:650 12px/1 var(--font-ui);font-stretch:var(--wd-col);color:var(--txt2)}
.rt b{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt .mono{color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route>.i{color:var(--accent);width:20px;height:20px}
.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rd{display:grid;gap:6px;padding-left:10px;border-left:2px solid var(--line-2)}
.rd .v{font:600 15px/1 var(--font-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.graph{margin-top:16px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--s1);padding:10px 12px 10px}
.g-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.g-top .k{font:650 12px/1 var(--font-ui);font-stretch:var(--wd-col);color:var(--txt2)}
.g-plot{position:relative;height:64px;background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 16px}
.g-plot svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.g-area{fill:color-mix(in oklab,var(--accent) 18%,transparent)}
.g-line{fill:none;stroke:var(--accent);stroke-width:1.5;vector-effect:non-scaling-stroke}
.g-now{stroke:var(--txt3);stroke-width:1;stroke-dasharray:3 4;vector-effect:non-scaling-stroke}
.g-head{position:absolute;top:0;bottom:0;width:0;border-left:1px solid var(--accent);left:0}
.g-head::after{content:"";position:absolute;left:-4px;top:var(--hy,10px);width:7px;height:7px;border-radius:var(--r-dot);background:var(--accent);box-shadow:var(--glow) var(--accent);transform:translateY(-50%)}
.g-bar{height:4px;margin-top:8px;background:var(--line-2);border-radius:2px;overflow:hidden}
.g-bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transform:scaleX(var(--p,0))}
.cw.paused .g-bar i,.cw.wait .g-bar i{background:var(--part)}
.cw.cancelled .g-bar i{background:var(--miss)}
.cw-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.cw-acts .btn{height:40px;min-width:112px}
.conf{border-top:1px solid var(--line);background:color-mix(in oklab,var(--part) 5%,var(--s2));padding:14px 18px 18px;display:grid;gap:12px}
.conf.res{background:var(--s2)}
.conf-h{display:flex;align-items:center;gap:10px;font-size:14px}
.conf-h b{font-weight:700;font-family:var(--font-mono);font-size:13px}
.conf-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cc{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto;column-gap:12px;row-gap:4px;align-items:center;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--s1)}
.cc .fi{grid-row:1/3;width:24px;height:24px}
.cc .k{font:650 12px/1.2 var(--font-ui);font-stretch:var(--wd-col);color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cc .mono{color:var(--txt)}
.cc .tags{grid-column:1/-1;display:none;gap:6px;margin-top:4px}
.conf.cmp .cc .tags{display:flex}
.conf.cmp .cc.win-side{border-color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--r-sm);font:500 12px/1 var(--font-mono);background:var(--sel-bg);color:var(--accent)}
.tag.dim{background:var(--line);color:var(--txt2)}
.conf-acts{display:flex;gap:8px;flex-wrap:wrap}
.conf-acts .btn{height:40px}
.conf-done{display:flex;align-items:center;gap:10px;color:var(--txt)}

/* theme shutter */
.blades{position:fixed;top:0;bottom:0;left:-14%;right:-14%;z-index:2147482000;display:none;pointer-events:none;transform:skewX(-12deg)}
.blades.on{display:flex}
.blades i{flex:1;transform-origin:left center;transform:scaleX(0);box-shadow:inset -2px 0 0 var(--acc-dark)}
.blades.to-light i{background:var(--blade-light)}
.blades.to-dark i{background:var(--blade-dark)}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- responsive ---------- */
@media (max-width:1180px){
  :root{--side-w:216px;--rail-w:30px}
  .search{width:220px}
  .wtitle .wpath{display:none}
}
@media (max-width:920px){
  .seg.opt{display:none}
  .pane[data-kind="b"]{--cols:minmax(0,1fr) 132px 100px 66px}
  .pane[data-kind="s"]{--cols:minmax(0,1fr) 130px 70px minmax(0,1fr)}
  .pane[data-kind="s"] .c-type,.pane[data-kind="s"] .hc-kind{display:none}
  .search{width:190px}
  .brand b{display:none}
  .cw-main{grid-template-columns:132px minmax(0,1fr)}
  .ring{width:132px;height:132px}
  .r-pct{font-size:28px}
}
@media (max-width:640px){
  :root{--h-tool:56px}
  .body{grid-template-columns:minmax(0,1fr)}
  .side{position:absolute;z-index:35;left:0;top:calc(var(--h-title) + var(--h-tool) + var(--h-hud));bottom:var(--h-status);width:min(280px,84vw);transform:translateX(-102%);transition:transform 220ms var(--ease-out);box-shadow:var(--e5)}
  .win.drawer .side{transform:none}
  .rail{display:none}
  .side-toggle{display:grid}
  .brand{display:none}
  .titlebar{gap:8px;padding-left:12px}
  .accents{gap:4px;padding:0 4px}
  .acc{width:28px}
  #b-fwd,#b-refresh{display:none}
  .toolbar{gap:6px;padding:0 6px}
  .search{width:44px;padding:0;justify-content:center;gap:0}
  .search .i{margin:0}
  .search input{position:absolute;opacity:0;width:1px;pointer-events:none}
  .search.has,.search:focus-within{width:118px;padding:0 4px 0 10px;justify-content:flex-start;gap:6px}
  .search.has input,.search:focus-within input{position:static;opacity:1;width:auto;pointer-events:auto}
  .search.has .q-clear{width:28px}
  .a-ico{width:32px}
  .pane{margin:6px}
  .opts{margin:6px 6px 0}
  .opts-k{display:none}
  .pane[data-kind="b"]{--cols:minmax(0,1fr) 128px}
  .pane[data-kind="b"] .c-type,.pane[data-kind="b"] .c-size,.pane[data-kind="b"] .hc-kind,.pane[data-kind="b"] .hc-size{display:none}
  .pane[data-kind="s"]{--cols:minmax(0,1fr) minmax(0,1fr)}
  .pane[data-kind="s"] .c-date,.pane[data-kind="s"] .c-size,.pane[data-kind="s"] .hc-modified,.pane[data-kind="s"] .hc-size{display:none}
  .lh,.row{column-gap:10px;padding:0 10px 0 6px}
  .hud .seg{padding:0 10px}
  .seg.r{display:none}
  .status{gap:8px}
  .cw-main{grid-template-columns:1fr;justify-items:center}
  .reads{grid-template-columns:repeat(3,minmax(0,1fr));width:100%}
  .route{grid-template-columns:1fr}

/* ---------- steps ---------- */
function go(step, o){
  o = o || {};
  var prev = S.step;
  if(prev === step && !o.force) return;
  closeMenu(); closeQL(); hideTip(); closeDrawer();
  if(prev === 'address') stopType();
  S.step = step; win.setAttribute('data-at', step);
  Object.keys(SECS).forEach(function(k){ SECS[k].hidden = k !== step; });
  var sec = SECS[step];
  if(step === 'browse') renderBrowse(sec, { animate: o.animate });
  else if(step === 'address'){ if(B.path !== C.cwd) setPath(C.cwd); renderBrowse(sec, { dim: true }); }
  else if(step === 'search'){ if(prev === 'address' || prev === 'browse') { if(!o.keepQuery) R.q = C.search.query; } renderSearch(sec); }
  else if(step === 'copy'){ renderSearch(sec, { dim: true }); renderCopy(sec); }
  renderChrome();
  if(step === 'address') startType();
  if(step === 'search') runSearch();
  if(step === 'copy') enterCopy();
  if(!reduce() && prev !== step){
    var tgt = step === 'copy' ? $('.pane', sec) : sec;
    tgt.animate([{ opacity: 0 }, { opacity: step === 'copy' ? .55 : 1 }], { duration: 170, easing: 'ease-out' });
  }
  if(step === 'browse' || step === 'search') focusList();
}
function stepAction(kind){
  if(kind === 'continue'){
    if(S.step === 'browse') go('address');
    else if(S.step === 'address') go('search');
    else if(S.step === 'search'){ if(selIds(R).length) go('copy'); }
  } else {
    if(S.step !== 'browse') go('browse');
  }
}

  tipT = setTimeout(function(){ if(tipFor === el) showTip(el); }, 420);
});
document.addEventListener('focusin', function(e){ var el = e.target.closest && e.target.closest('[data-tip]'); if(el && el.matches(':focus-visible')){ tipFor = el; showTip(el); } });
document.addEventListener('focusout', hideTip);

/* ---------- events ---------- */
document.addEventListener('pointerdown', function(e){
  hideTip();
  if(menuFor && !e.target.closest('#menu') && !menuFor.contains(e.target)) closeMenu();
  if(win.classList.contains('drawer') && !e.target.closest('#side') && !e.target.closest('#side-toggle')) closeDrawer();
  var row = e.target.closest('.row');
  if(row && e.button === 0 && !row.closest('.dim') && !e.target.closest('input')){ model().focus = row.dataset.id; pick(row.dataset.id, e); }
});
win.addEventListener('dblclick', function(e){ var row = e.target.closest('.row'); if(row && !row.closest('.dim')) openSel(); });
win.addEventListener('click', function(e){
  var t = e.target;
  var act = t.closest('[data-action]');
  if(act && !act.disabled){
    if(act.classList.contains('ta-row')){ TA.hi = +act.dataset.i; }
    stepAction(act.getAttribute('data-action')); return;
  }
  var b;
  if((b = t.closest('[data-go]'))){ navigate(b.getAttribute('data-go')); return; }
  if((b = t.closest('[data-menu]'))){ openMenu(b, b.getAttribute('data-menu')); return; }
  if((b = t.closest('[data-sort]'))){
    var pane = b.closest('.pane'); if(pane.classList.contains('dim')) return;
    var m = pane.dataset.kind === 's' ? R : B, k = b.dataset.sort;
    if(m.sort && m.sort.key === k) m.sort = { key: k, dir: -m.sort.dir };
    else m.sort = { key: k, dir: (k === 'modified' || k === 'size') ? -1 : 1 };
    paintHead(pane, m.sort);
    if(m === B){ B.items = sortItems(listing(B.path) || [], B.sort, true); $('.list', pane).innerHTML = B.items.map(function(it){ return rowHTML(it, B.sel, 'b'); }).join(''); }
    else { R.items = filteredResults(); $('.list', pane).innerHTML = resultRows(); }
    if(!reduce()) $('.list', pane).animate([{ opacity: .35 }, { opacity: 1 }], { duration: 160, easing: 'ease-out' });
    renderHUD(); renderStatus(); renderRail(); return;
  }
  if((b = t.closest('[data-chip]'))){
    var c = R.chips, key = b.dataset.chip;
    if(key === 'date') c.date = !c.date; else if(key === 'kind') c.kind = (c.kind + 1) % 3; else c.size = (c.size + 1) % 3;
    refreshResults(true); return;
  }
  if((b = t.closest('[data-scope]'))){ R.chips.scope = b.dataset.scope; refreshResults(true); return; }
  if(t.closest('[data-clear-opts]')){ R.chips = { date: false, kind: 0, size: 0, scope: 'all' }; if(!R.q) R.q = C.search.query; renderSearchBox(); refreshResults(true); return; }
  if((b = t.closest('[data-acc]'))){ setAccent(b.dataset.acc); return; }
  if(t.closest('[data-theme-toggle]')){ shutter(theme() === 'dark' ? 'light' : 'dark'); return; }
  if(t.closest('#b-back') || t.closest('[data-nav="back"]')){ histBack(); return; }
  if(t.closest('#b-fwd')){ histFwd(); return; }
  if(t.closest('#b-up')){ goUp(); return; }
  if(t.closest('#b-refresh')){ refresh(); return; }
  if(t.closest('#q-clear')){ e.preventDefault(); $('#q').value = ''; $('#search').classList.remove('has'); if(S.step === 'search'){ R.q = ''; go('browse'); } return; }
  if(t.closest('#side-toggle')){ var open = !win.classList.contains('drawer'); win.classList.toggle('drawer', open); $('#side-toggle').setAttribute('aria-expanded', open); return; }
  if((b = t.closest('.sh'))){ var g = b.closest('.sgrp'), shut = !g.classList.contains('shut'); g.classList.toggle('shut', shut); b.setAttribute('aria-expanded', !shut); return; }
  if((b = t.closest('[data-res]'))){ resolve(b.dataset.res); return; }
  if(t.closest('#cw-pause')){ if(CP.state === 'run'){ CP.state = 'paused'; CP.arm = 0; } else if(CP.state === 'paused'){ CP.state = 'run'; kick(); } paintCopyState(); return; }
  if(t.closest('#cw-cancel')){
    if(CP.arm){ CP.state = 'cancelled'; CP.arm = 0; clearTimeout(CP.armT); }
    else { CP.arm = 1; clearTimeout(CP.armT); CP.armT = setTimeout(function(){ CP.arm = 0; paintCopyState(); }, 3000); }
    paintCopyState(); return;
  }
  if(t.closest('.ql') && !t.closest('.ql-card')){ closeQL(); return; }
  if(S.step === 'address' && t.closest('#st-address')){ go('browse'); return; }
});
$('#rail').addEventListener('pointerdown', function(e){
  var r = this.getBoundingClientRect(), m = model(), n = m.items.length; if(!n) return;
  var k = Math.max(0, Math.min(n - 1, Math.floor((e.clientY - r.top - 14) / (r.height - 28) * n)));
  if(S.step === 'browse' || S.step === 'search'){ setSel(m, [m.items[k].id]); m.anchor = m.focus = m.items[k].id; afterSel(m.items[k].id); }
});
var q = $('#q');
q.addEventListener('input', function(){
  $('#search').classList.toggle('has', !!q.value);
  if(S.step === 'search'){ R.q = q.value; refreshResults(false); renderTicker(); }
});
q.addEventListener('keydown', function(e){
  if(e.key === 'Enter' && q.value.trim()){ e.preventDefault(); R.q = q.value.trim(); if(S.step !== 'search') go('search', { keepQuery: true }); }
  else if(e.key === 'Escape'){ e.preventDefault(); if(S.step === 'search'){ go('browse'); } else { q.value = ''; $('#search').classList.remove('has'); q.blur(); } }
});
document.addEventListener('keydown', function(e){
  var tg = e.target, inField = tg && tg.matches && tg.matches('input,textarea');
  var mod = e.metaKey || e.ctrlKey, k = e.key;
  if(k === 'Escape'){
    if(menuFor){ closeMenu(); return; }
    if(closeQL()) return;
    if(win.classList.contains('drawer')){ closeDrawer(); return; }
    if(!inField && S.step === 'address'){ go('browse'); return; }
  }
  if(mod && (k === 'd' || k === 'D' || k === 'l' || k === 'L')){ e.preventDefault(); if(S.step !== 'address') go('address'); return; }
  if(mod && (k === 'f' || k === 'F')){ e.preventDefault(); q.focus(); return; }
  if(inField) return;
  if(mod && k === 'ArrowLeft'){ e.preventDefault(); histBack(); return; }
  if(mod && k === 'ArrowRight'){ e.preventDefault(); histFwd(); return; }
  if(mod && k === 'ArrowUp'){ e.preventDefault(); goUp(); return; }
  if(k === 'F5'){ e.preventDefault(); refresh(); return; }
  if(S.step !== 'browse' && S.step !== 'search') return;
  if(tg && tg.closest && tg.closest('button') && (k === 'Enter' || k === ' ')) return;
  if(k === 'ArrowDown' || k === 'ArrowUp'){ e.preventDefault(); if(!$('#ql').hidden) closeQL(); moveSel(k === 'ArrowDown' ? 1 : -1, e.shiftKey); }
  else if(k === 'Home' || k === 'End'){ e.preventDefault(); var ids = orderIds(); if(ids.length){ var m = model(), id = k === 'Home' ? ids[0] : ids[ids.length - 1]; setSel(m, [id]); m.anchor = m.focus = id; afterSel(id); } }
  else if(k === 'Enter'){ e.preventDefault(); openSel(); }
  else if(k === ' '){ e.preventDefault(); toggleQL(); }
  else if(k === 'F2'){ e.preventDefault(); rename(); }
  else if(mod && (k === 'a' || k === 'A')){ e.preventDefault(); var mm = model(); setSel(mm, orderIds()); afterSel(); }
});
window.addEventListener('resize', function(){ closeMenu(); syncRailWin(); clipCrumbs(); });

/* ---------- boot ---------- */
paintThemeBtn(); paintAccents(); renderSide();
renderBrowse(SECS.browse, { animate: true });
renderChrome();
if(!reduce()){
  $$('.segbar i.on').forEach(function(s, i){ s.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 160, delay: 200 + i * 110, fill: 'backwards' }); });
  $$('#hud .seg').forEach(function(s, i){ s.animate([{ opacity: 0, transform: 'translateY(-4px)' }, { opacity: 1, transform: 'none' }], { duration: 220, delay: 60 + i * 50, fill: 'backwards', easing: 'cubic-bezier(.2,.8,.2,1)' }); });
}
})();
</script>
<script src="../_vote/hub-bridge.js"></script>
<script src="../_vote/vote.js" data-design="d1" data-label="D1 Control room"></script>
</body>
