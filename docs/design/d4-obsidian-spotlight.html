<style>
/* ============ Obsidian spotlight: tokens.css (copied from the look) ============ */
:root, :root[data-theme="dark"] {
  --bg: #08090C; --s1: #0F1116; --s2: #14171E; --s3: #1B1F28; --s4: #232834;
  --line: #1E222B; --line-2: #2A2F3A; --outline: #3A4050;
  --glass: color-mix(in srgb, var(--bg) 84%, transparent);
  --text: #EDEFF3; --text-2: #C3C8D2; --muted: #8A919E; --faint: #5C6370;
  --accent: #4F8CFF; --accent-ink: #08090C;
  --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
  --mark: color-mix(in srgb, var(--accent) 34%, transparent);
  --shadow-1: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35);
  --shadow-2: 0 10px 30px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.4);
  --shadow: 0 18px 44px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --shadow-4: 0 30px 80px rgba(0,0,0,.7), 0 4px 12px rgba(0,0,0,.5);
  --glow-a: 16%;
  --h-blue: #4D9BFF; --h-violet: #A98BFF; --h-amber: #FFB443; --h-teal: #2DD4BF;
  --h-pink: #FF6BB5; --h-orange: #FF6A3D; --h-cyan: #5EC8E0; --h-lime: #B8E63A;
  --h-gold: #E8C547; --h-coral: #FF8A80; --h-green: #4ADE80; --h-magenta: #E255FF;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F7F8FA; --s1: #FFFFFF; --s2: #EEF0F4; --s3: #E4E7ED; --s4: #D9DDE5;
  --line: #E1E4EA; --line-2: #CFD4DD; --outline: #B9BFCB;
  --glass: color-mix(in srgb, var(--bg) 86%, transparent);
  --text: #14171E; --text-2: #2E3440; --muted: #5B6270; --faint: #8A919E;
  --accent: #1F5FE0; --accent-ink: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --mark: color-mix(in srgb, var(--accent) 22%, transparent);
  --shadow-1: 0 1px 2px rgba(20,23,30,.08), 0 6px 18px rgba(20,23,30,.08);
  --shadow-2: 0 10px 30px rgba(20,23,30,.12), 0 2px 6px rgba(20,23,30,.06);
  --shadow: 0 18px 44px rgba(20,23,30,.14), 0 2px 6px rgba(20,23,30,.08);
  --shadow-4: 0 30px 80px rgba(20,23,30,.2), 0 4px 12px rgba(20,23,30,.1);
  --glow-a: 12%;
  --h-blue: #1A5FE0; --h-violet: #6B3FD6; --h-amber: #9A5A00; --h-teal: #0A7C70;
  --h-pink: #C2187A; --h-orange: #C43B0E; --h-cyan: #0C6F8A; --h-lime: #4C7A00;
  --h-gold: #8A6500; --h-coral: #C0392B; --h-green: #1B7F3F; --h-magenta: #A21CAF;
  color-scheme: light;
}
:root {
  --ok: var(--h-green); --part: var(--h-amber); --miss: var(--h-coral);
  --r-s: 8px; --r: 12px; --r-l: 16px; --r-xl: 22px;
  --font: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(.2, 0, 0, 1);
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-in: cubic-bezier(.4, 0, 1, 1);
  --spring: linear(0, .013 .8%, .05 1.7%, .19 3.6%, .64 8.6%, .83 11.2%, .96 13.6%, 1.03 16.1%, 1.05 18.7%, 1.03 24%, .99 30.5%, 1);
  --spring-soft: linear(0, .2 4%, .5 9%, .8 15%, .96 22%, 1.01 30%, 1);
  --t-fast: 120ms; --t: 220ms; --t-slow: 420ms;
  --rise: 8px;
  --tip-bg: var(--s4);
}

/* ============ Folio app tokens (semantic, per theme) ============ */
:root, :root[data-theme="dark"] {
  --acc-l: var(--acc-ld); --acc-c: var(--acc-cd);
  --accent: oklch(var(--acc-l) var(--acc-c) var(--acc-h));
  --pane: var(--bg); --chrome: var(--bg); --side: var(--bg);
  --bar: color-mix(in srgb, var(--s1) 78%, transparent);
  --bar-solid: color-mix(in srgb, var(--s1) 78%, var(--bg));
  --pop: color-mix(in srgb, var(--s2) 88%, transparent);
  --tray: color-mix(in srgb, var(--s1) 86%, transparent);
  --field: color-mix(in srgb, var(--bg) 72%, transparent);
  --head-bg: color-mix(in srgb, var(--bg) 80%, transparent);
  --scrim: color-mix(in srgb, var(--bg) 58%, transparent);
  --row-line: color-mix(in srgb, var(--line) 62%, transparent);
  --sel: color-mix(in srgb, var(--accent) 15%, transparent);
  --well: color-mix(in srgb, var(--bg) 45%, transparent);
  --seg-bg: var(--s1); --thumb: var(--s3);
}
:root[data-theme="light"] {
  --acc-l: var(--acc-ll); --acc-c: var(--acc-cl);
  --accent: oklch(var(--acc-l) var(--acc-c) var(--acc-h));
  --pane: var(--s1); --chrome: var(--s2); --side: var(--bg);
  --bar: color-mix(in srgb, var(--s1) 84%, transparent);
  --bar-solid: var(--s1);
  --pop: color-mix(in srgb, var(--s1) 93%, transparent);
  --tray: color-mix(in srgb, var(--s1) 90%, transparent);
  --field: var(--bg);
  --head-bg: color-mix(in srgb, var(--s1) 86%, transparent);
  --scrim: color-mix(in srgb, var(--s4) 52%, transparent);
  --row-line: color-mix(in srgb, var(--line) 80%, transparent);
  --sel: color-mix(in srgb, var(--accent) 11%, transparent);
  --well: var(--bg);
  --seg-bg: var(--s2); --thumb: var(--s1);
}
:root {
  /* accent: one hue (degrees, OKLCH); 262 gives the look's electric blue in both themes */
  --acc-h: 262; --acc-ld: .657; --acc-cd: .182; --acc-ll: .528; --acc-cl: .207;
  --tl-close: var(--h-coral); --tl-min: var(--h-amber); --tl-max: var(--h-green);
  --r-xs: 5px; --r-chip: 10px;
  --title-h: 44px; --bar-h: 52px; --status-h: 28px; --row-h: 26px; --side-w: 248px;
  --gut-l: 14px; --gut-r: 44px;
  --cols: minmax(0, 1fr) 168px 148px 96px;
  --scols: minmax(0, 1fr) minmax(0, 1.25fr) 172px 92px;
}

/* ============ Obsidian spotlight: look.css (copied from the look) ============ */
body { margin: 0; background: var(--bg); color: var(--text); font: 400 15px/1.5 var(--font); font-feature-settings: "ss01", "cv11"; -webkit-font-smoothing: antialiased; transition: background-color var(--t) var(--ease), color var(--t) var(--ease); }
h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: -.015em; }
h1 { letter-spacing: -.035em; } h2 { letter-spacing: -.025em; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 40%, transparent); }
::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.os-num { font-variant-numeric: tabular-nums; }
.os-label { font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.os-glass { background: var(--glass); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
.os-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--s2); color: var(--text); font: 500 14px var(--font); white-space: nowrap; cursor: pointer; transition: transform var(--t-fast) var(--ease), background-color var(--t) var(--ease), border-color var(--t) var(--ease), box-shadow var(--t) var(--ease); }
.os-btn:hover { border-color: var(--hue, var(--outline)); text-decoration: none; }
.os-btn:active { transform: scale(.97); }
.os-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 600; }
.os-btn.primary:hover { box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 35%, transparent); }
.os-btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.os-btn.ghost:hover { background: var(--s2); }
.os-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.os-chip { display: inline-flex; align-items: center; gap: 7px; min-height: 34px; padding: 0 11px 0 10px; border: 1px solid var(--line-2); border-radius: var(--r-chip); background: var(--s1); color: var(--text-2); font: 500 13px var(--font); white-space: nowrap; }
.os-chip .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--hue, var(--muted)); box-shadow: 0 0 10px color-mix(in srgb, var(--hue, var(--muted)) 70%, transparent); }
.os-chip[aria-pressed="true"], .os-chip.on { border-color: var(--hue, var(--text)); color: var(--text); background: color-mix(in srgb, var(--hue, var(--text)) 14%, var(--s1)); }
.os-card, .os-row { position: relative; isolation: isolate; }
.os-card { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-l); overflow: hidden; transition: border-color var(--t) var(--ease), transform var(--t) var(--ease-out); }
.os-card:hover { border-color: color-mix(in srgb, var(--hue, var(--accent)) 45%, var(--line)); }
.os-row { border-bottom: 1px solid var(--line); padding: 14px 12px 14px 16px; }
.os-card::before, .os-row::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; opacity: 0; transition: opacity .25s var(--ease); background: radial-gradient(380px circle at var(--mx, 30%) var(--my, 40%), color-mix(in srgb, var(--hue, var(--accent)) var(--glow-a), transparent), transparent 72%); }
.os-card:hover::before, .os-card:focus-within::before, .os-row:hover::before, .os-row:focus-within::before, .os-row.on::before { opacity: 1; }
.os-row::after, .os-card.edge::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--hue, var(--accent)); box-shadow: 0 0 14px color-mix(in srgb, var(--hue, var(--accent)) 60%, transparent); transition: width .18s var(--ease); }
.os-row:hover::after, .os-row.on::after, .os-card.edge:hover::after { width: 5px; }
.os-glow { position: absolute; inset: -20%; z-index: 0; pointer-events: none; background: radial-gradient(600px 420px at 30% 20%, color-mix(in srgb, var(--h-blue) 18%, transparent), transparent 70%), radial-gradient(520px 380px at 75% 80%, color-mix(in srgb, var(--h-pink) 13%, transparent), transparent 70%), radial-gradient(420px 320px at 80% 15%, color-mix(in srgb, var(--h-violet) 12%, transparent), transparent 70%); animation: os-drift 18s ease-in-out infinite alternate; }
@keyframes os-drift { to { transform: translate(-3%, 2%) rotate(4deg); } }
.os-rise { animation: os-rise 280ms var(--ease-out) both; animation-delay: calc(var(--i, 0) * 22ms); }
@keyframes os-rise { from { opacity: 0; transform: translateY(var(--rise)); } }

/* ============ Folio window ============ */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { overflow: hidden; }
button, input { font: inherit; color: inherit; }
i, em, cite, var, dfn, address { font-style: normal; }
button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
.app, .app > section { height: 100%; }
.grow { flex: 1 1 auto; min-width: 0; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 500; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }

.win { position: relative; height: 100%; display: grid; grid-template-rows: var(--title-h) minmax(0, 1fr) var(--status-h); background: var(--pane); color: var(--text); font-size: 13px; line-height: 1.35; overflow: hidden; transition: background-color var(--t) var(--ease), color var(--t) var(--ease); }

/* designed file and folder glyphs: each takes its type's neon hue */
.fi { width: 16px; height: 16px; flex: none; overflow: visible; transition: filter var(--t) var(--ease); }
.fi .fb { fill: color-mix(in srgb, var(--hue) 40%, transparent); }
.fi .ff { fill: color-mix(in srgb, var(--hue) 20%, var(--pane)); stroke: var(--hue); stroke-width: 1.1; stroke-linejoin: round; }
.fi .fl { fill: none; stroke: var(--hue); stroke-width: 1.1; stroke-linecap: round; opacity: .85; }
.fi.file .pg { fill: color-mix(in srgb, var(--hue) 9%, var(--pane)); stroke: color-mix(in srgb, var(--hue) 62%, var(--muted)); stroke-width: 1.1; stroke-linejoin: round; }
.fi.file .fd { fill: none; stroke: color-mix(in srgb, var(--hue) 62%, var(--muted)); stroke-width: 1.1; stroke-linejoin: round; }
.fi.file .ln { fill: none; stroke: var(--hue); stroke-width: 1.3; stroke-linecap: round; }

/* icon buttons: state layer, press shrink */
.ib { position: relative; display: inline-grid; place-items: center; flex: none; width: 44px; height: 44px; padding: 0; border: 0; border-radius: var(--r); background: transparent; color: var(--text-2); cursor: pointer; transition: transform var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.ib::after { content: ""; position: absolute; inset: 5px; border-radius: var(--r-s); background: currentColor; opacity: 0; transition: opacity var(--t-fast) var(--ease); pointer-events: none; }
.ib > svg { grid-area: 1 / 1; }
.ib:hover { color: var(--text); }
.ib:hover::after { opacity: .08; }
.ib:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
.ib:focus-visible::after { opacity: .1; }
.ib:active { transform: scale(.92); }
.ib:active::after { opacity: .14; }
.ib:disabled { color: var(--faint); cursor: not-allowed; transform: none; }
.ib:disabled::after { opacity: 0; }

/* ---- title bar with tabs ---- */
.titlebar { position: relative; z-index: 7; display: flex; align-items: stretch; gap: 10px; min-width: 0; padding: 0 6px 0 16px; background: var(--chrome); box-shadow: inset 0 -1px 0 var(--line); user-select: none; }
.lights { display: flex; align-items: center; gap: 8px; flex: none; }
.tl { display: block; width: 12px; height: 12px; border-radius: 50%; background: var(--tl); box-shadow: inset 0 0 0 .5px color-mix(in srgb, var(--bg) 45%, transparent); }
.tabs { display: flex; align-items: flex-end; gap: 2px; min-width: 0; margin-left: 10px; }
.tab { position: relative; display: flex; align-items: center; height: 36px; min-width: 0; max-width: 260px; border: 1px solid transparent; border-bottom: 0; border-radius: var(--r-s) var(--r-s) 0 0; color: var(--muted); transition: background-color var(--t) var(--ease), color var(--t) var(--ease); }
.tab:not(.on):hover { background: color-mix(in srgb, var(--text) 5%, transparent); color: var(--text-2); }
.tab.on { background: var(--bar-solid); color: var(--text); border-color: var(--line-2) var(--line) transparent; }
.tab.on::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 2px; border-radius: 2px 2px 0 0; background: var(--accent); }
.tab-main { display: flex; align-items: center; gap: 8px; min-width: 0; height: 100%; padding: 0 12px 0 13px; border: 0; background: none; color: inherit; font: 500 13px var(--font); cursor: pointer; }
.tab-main .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-main svg.i { width: 15px; height: 15px; color: var(--accent); }
.tab-main:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: var(--r-s); }
.tab-x { width: 30px; height: 30px; margin-right: 4px; }
.tab-x svg { width: 14px; height: 14px; }
.tab-new { align-self: center; color: var(--muted); }
.tab-new svg { width: 16px; height: 16px; }
.acc-btn { align-self: center; }
.acc-btn .sw { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 22%, transparent), 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); transition: transform var(--t) var(--spring); }
.acc-btn:hover .sw, .acc-btn[aria-expanded="true"] .sw { transform: scale(1.14); }
.picker { position: absolute; z-index: 45; width: 316px; padding: 12px 14px 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--pop); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); box-shadow: var(--shadow-2); transform-origin: 100% 0; animation: drop var(--t-slow) var(--spring-soft) backwards; }
.pk-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.pk-val { color: var(--text-2); font-size: 12px; }
.pk-pre { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin: 0 -4px 6px; }
.pk-sw { position: relative; display: grid; place-items: center; height: 36px; padding: 0; border: 0; border-radius: var(--r-s); background: none; cursor: pointer; }
.pk-sw::before { content: ""; width: 22px; height: 22px; border-radius: 50%; background: oklch(var(--acc-l) var(--acc-c) var(--h)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 16%, transparent); transition: transform var(--t) var(--spring); }
.pk-sw:hover::before { transform: scale(1.15); }
.pk-sw:active::before { transform: scale(.88); }
.pk-sw[aria-checked="true"]::after { content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; border: 2px solid var(--text); }
.pk-sw:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.pk-range { display: block; width: 100%; height: 36px; margin: 0; padding: 0; background: none; -webkit-appearance: none; appearance: none; cursor: pointer; }
.pk-range:focus-visible { outline: none; }
.pk-range::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: var(--spectrum); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text) 14%, transparent); }
.pk-range::-moz-range-track { height: 14px; border-radius: 7px; background: var(--spectrum); }
.pk-range::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; margin-top: -4px; border: 3px solid var(--text); border-radius: 50%; background: var(--accent); box-shadow: var(--shadow-1); transition: transform var(--t-fast) var(--ease); }
.pk-range::-moz-range-thumb { width: 16px; height: 16px; border: 3px solid var(--text); border-radius: 50%; background: var(--accent); }
.pk-range:active::-webkit-slider-thumb { transform: scale(1.12); }
.pk-range:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-1); }
.pk-f { display: flex; align-items: center; gap: 12px; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.pk-var { display: inline-flex; align-items: center; gap: 6px; }
.pk-var i { width: 10px; height: 10px; border-radius: 50%; }
.pk-var .d { background: oklch(var(--acc-ld) var(--acc-cd) var(--acc-h)); }
.pk-var .l { background: oklch(var(--acc-ll) var(--acc-cl) var(--acc-h)); }
.pk-note { margin-left: auto; }
.room-theme { position: fixed; left: 0; bottom: 0; width: 1px; height: 1px; margin: 0; padding: 0; overflow: hidden; border: 0; background: transparent; opacity: .06; pointer-events: none; }

/* ---- body, frosted sticky toolbar ---- */
.body { position: relative; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-width: 0; min-height: 0; }
.toolbar { position: absolute; z-index: 6; top: 0; left: 0; right: 0; height: var(--bar-h); display: flex; align-items: center; gap: 4px; padding: 0 12px 0 8px; border-bottom: 1px solid var(--line); }
.toolbar::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--bar); backdrop-filter: blur(16px) saturate(1.4); -webkit-backdrop-filter: blur(16px) saturate(1.4); }
.side-toggle { display: none !important; }

.addr, .search { position: relative; height: 44px; display: flex; align-items: center; min-width: 0; isolation: isolate; }
.addr { --hue: var(--accent); flex: 1 1 auto; margin: 0 4px 0 8px; padding: 0 8px 0 4px; cursor: text; }
.addr::before, .search::before { content: ""; position: absolute; inset: 3px 0; z-index: -2; border-radius: var(--r); background: var(--field); border: 1px solid var(--line-2); transition: border-color var(--t) var(--ease), box-shadow var(--t) var(--ease); }

/* typeahead: a spotlight panel that drops from the address bar */
.ta { position: absolute; z-index: 30; top: calc(100% + 2px); left: 0; right: 0; padding: 6px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--pop); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); box-shadow: var(--shadow-2); transform-origin: 50% 0; animation: drop var(--t-slow) var(--spring-soft) backwards; cursor: default; }

.ta-row:hover { background: color-mix(in srgb, var(--text) 5%, transparent); }

.ta-row.hi::after { content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent); box-shadow: 0 0 12px var(--accent); }

kbd { display: inline-flex; align-items: center; height: 20px; padding: 0 6px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: var(--r-xs); background: var(--s2); color: var(--text-2); font: 500 12px/1 var(--mono); }

/* ---- sidebar: spotlight cards ---- */
.side { grid-column: 1; grid-row: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: calc(var(--bar-h) + 10px) 10px 14px; background: var(--side); border-right: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: var(--s4) transparent; }

.scard-b { display: grid; grid-template-rows: 1fr; transition: grid-template-rows var(--t-slow) var(--spring-soft); }

.sitem { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; height: 30px; padding: 0 12px 0 14px; border: 0; background: none; color: var(--text-2); font: 500 13px var(--font); text-align: left; white-space: nowrap; cursor: pointer; isolation: isolate; }
.sitem::before { content: ""; position: absolute; inset: 1px 6px; z-index: -1; border-radius: var(--r-s); background: currentColor; opacity: 0; transition: opacity var(--t-fast) var(--ease); }
.sitem:hover { color: var(--text); }

.sitem:focus-visible { outline: 2px solid var(--accent); outline-offset: -3px; border-radius: var(--r-s); }
.cap { position: relative; height: 6px; margin: 6px 14px 8px; overflow: hidden; border-radius: 3px; background: var(--s3); }
.cap i { position: absolute; top: 0; bottom: 0; left: 0; border-radius: inherit; background: var(--hue); box-shadow: 0 0 10px var(--hue); transform-origin: left; animation: grow 700ms var(--ease-out) 200ms backwards; }
@keyframes grow { from { transform: scaleX(0); } }
.cap-l { padding: 0 14px 6px; color: var(--muted); font: 400 12px var(--mono); }
.cap-l b { color: var(--text-2); font-weight: 500; }
.dt { padding: 2px 14px 10px; }
.dt-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; min-width: 0; }
.dt-top .fi { width: 34px; height: 34px; }
.dt-name { overflow-wrap: anywhere; color: var(--text); font: 600 14px/1.3 var(--font); letter-spacing: -.01em; }

/* ---- file list: hairline rows with a glowing hue edge ---- */
.main { grid-column: 2; grid-row: 1; position: relative; min-width: 0; min-height: 0; display: flex; flex-direction: column; }

.under-bar { height: var(--bar-h); }

.ch { position: relative; display: flex; align-items: center; gap: 6px; min-width: 0; padding: 0 10px; border: 0; background: none; color: var(--muted); font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; cursor: pointer; }

.ch:active::after { opacity: .14; }

.rows { position: relative; padding: 4px 0 96px; outline: none; }
.row.os-row { display: grid; grid-template-columns: var(--cols); align-items: center; height: var(--row-h); padding: 0 var(--gut-r) 0 var(--gut-l); border-bottom: 1px solid var(--row-line); cursor: default; user-select: none; scroll-margin-top: calc(var(--bar-h) + var(--head-h, 34px)); scroll-margin-bottom: 24px; }

.row.os-row.on { background: var(--sel); border-bottom-color: transparent; }
.row.os-row.on::after { width: 3px; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.rows:focus-visible .row.on { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent); }
.row .c { min-width: 0; padding: 0 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-name { display: flex; align-items: center; gap: 9px; color: var(--text); font-weight: 500; }
.c-name .nm { overflow: hidden; text-overflow: ellipsis; }
.row:hover .fi, .row.on .fi { filter: drop-shadow(0 0 4px color-mix(in srgb, var(--hue) 55%, transparent)); }
.c-date, .c-size { color: var(--text-2); font: 400 12px var(--mono); font-variant-numeric: tabular-nums; }
.c-size { text-align: right; }
.c-type, .c-folder { color: var(--muted); }
.c-folder b { color: var(--text-2); font-weight: 500; }
.row.on .c-date, .row.on .c-size { color: var(--text); }
.rn { width: 100%; height: 22px; margin-left: -7px; padding: 0 6px; border: 1px solid var(--accent); border-radius: var(--r-xs); outline: 0; background: var(--s1); color: var(--text); font: 500 13px var(--font); box-shadow: 0 0 0 3px var(--accent-soft); }
.sk { display: grid; grid-template-columns: var(--cols); align-items: center; height: var(--row-h); padding: 0 var(--gut-r) 0 var(--gut-l); }
.sk i { display: block; height: 8px; margin: 0 10px; border-radius: 4px; background: linear-gradient(90deg, var(--s2), var(--s4), var(--s2)); background-size: 200% 100%; animation: shimmer 1.1s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.empty { display: grid; justify-items: center; gap: 8px; padding: 80px 24px; color: var(--muted); text-align: center; }
.empty .fi { width: 46px; height: 46px; margin-bottom: 6px; }
.e-t { color: var(--text); font: 600 15px var(--font); letter-spacing: -.01em; }
.e-s { max-width: 340px; font-size: 13px; }
.empty .os-btn { margin-top: 10px; }

/* ---- search options row ---- */
.opts { position: relative; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; min-height: 52px; padding: 8px var(--gut-r) 8px calc(var(--gut-l) + 10px); border-bottom: 1px solid var(--line); }

.chip:hover { border-color: var(--hue); color: var(--text); }

.chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { position: relative; display: inline-flex; padding: 3px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--seg-bg); }

.seg-t { position: absolute; z-index: 0; top: 3px; bottom: 3px; left: 0; width: var(--w, 0); transform: translateX(var(--x, 3px)); border-radius: var(--r-s); background: var(--thumb); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 50%, var(--line-2)), 0 0 16px color-mix(in srgb, var(--accent) 22%, transparent); transition: transform var(--t-slow) var(--spring), width var(--t-slow) var(--spring); }
.seg-t.snap { transition: none; }

.prog { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; pointer-events: none; }
.prog i { position: absolute; inset: 0; background: var(--accent); box-shadow: 0 0 10px var(--accent); transform: scaleX(0); transform-origin: left; }
.prog.run i { animation: prog var(--dur, 1200ms) var(--ease-out) forwards; }
.prog.done i { transform: scaleX(1); opacity: .4; transition: opacity .6s var(--ease); }
@keyframes prog { to { transform: scaleX(1); } }

/* selection tray (search): the visible Copy to... action */
.seltray { position: absolute; z-index: 8; left: 0; right: 0; bottom: 18px; width: max-content; max-width: calc(100% - 24px); margin: 0 auto; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px; border: 1px solid var(--line-2); border-radius: var(--r-l); background: var(--pop); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); box-shadow: var(--shadow-2); animation: tray-pop var(--t-slow) var(--spring) backwards; }
@keyframes tray-pop { from { opacity: 0; transform: translateY(16px) scale(.97); } }
.st-n { color: var(--text-2); white-space: nowrap; }
.st-n .num { color: var(--text); }
.st-size { padding: 0 12px 0 2px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.seltray .os-btn svg { width: 16px; height: 16px; }

/* ---- status bar ---- */
.status { position: relative; z-index: 4; display: flex; align-items: center; min-width: 0; padding: 0 6px; overflow: hidden; background: var(--chrome); border-top: 1px solid var(--line); color: var(--muted); font: 500 12px var(--font); white-space: nowrap; }
.sb { display: flex; align-items: center; gap: 6px; height: 100%; padding: 0 10px; flex: none; }
.sb.sep { box-shadow: inset 1px 0 0 var(--line); }
.sb .num { color: var(--text); }
.sb svg.i { width: 14px; height: 14px; }
.sb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.sb-dot.busy { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: pulse .8s ease-in-out infinite alternate; }
@keyframes pulse { to { opacity: .3; } }
.sb-sel { flex: 0 1 auto; min-width: 0; overflow: hidden; color: var(--text-2); text-overflow: ellipsis; }

/* ---- crumb menus, quick look, tooltips, toasts ---- */
.menu { position: absolute; z-index: 40; min-width: 220px; max-width: 320px; max-height: min(360px, 60vh); overflow-y: auto; padding: 6px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--pop); backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4); box-shadow: var(--shadow-2); transform-origin: 0 0; animation: drop var(--t) var(--spring-soft) backwards; scrollbar-width: thin; }
.menu > .os-label { display: block; padding: 7px 10px 8px; }
.mi { position: relative; display: flex; align-items: center; gap: 9px; width: 100%; height: 30px; padding: 0 10px; border: 0; border-radius: var(--r-s); background: none; color: var(--text-2); font: 500 13px var(--font); text-align: left; white-space: nowrap; cursor: pointer; }
.mi span { overflow: hidden; text-overflow: ellipsis; }
.mi:hover, .mi:focus-visible { background: color-mix(in srgb, var(--text) 7%, transparent); color: var(--text); outline: none; }
.mi.cur { color: var(--text); }
.mi .ck { margin-left: auto; width: 14px; height: 14px; color: var(--accent); }
.mi:disabled { color: var(--muted); cursor: default; background: none; }
.ql-wrap { position: absolute; z-index: 25; inset: 0; display: grid; place-items: center; padding: 16px; background: color-mix(in srgb, var(--bg) 40%, transparent); animation: fade var(--t) var(--ease) backwards; }
.ql { width: min(400px, 100%); padding: 22px 22px 16px; border-color: var(--line-2); background: var(--tray); backdrop-filter: blur(24px) saturate(1.4); -webkit-backdrop-filter: blur(24px) saturate(1.4); box-shadow: var(--shadow-4); animation: pop var(--t-slow) var(--spring) backwards; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.94); } }
.ql .dt-top .fi { width: 64px; height: 64px; }
.ql .dt-name { font-size: 17px; }
.ql-f { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
.ql-f .os-btn { margin-left: auto; }
.tip { position: fixed; z-index: 2147482000; top: 0; left: 0; display: flex; align-items: center; gap: 8px; max-width: 320px; padding: 5px 10px; border: 1px solid var(--line-2); border-radius: var(--r-s); background: var(--tip-bg); color: var(--text); font: 500 12px/1.3 var(--font); white-space: nowrap; box-shadow: var(--shadow-1); pointer-events: none; opacity: 0; transform: translateY(-3px); transition: opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.tip.k { padding-right: 6px; }
.tip.on { opacity: 1; transform: none; }
.toast { position: fixed; z-index: 2147481000; left: calc(var(--side-w) + 16px); bottom: calc(var(--status-h) + 14px); display: flex; align-items: center; gap: 9px; max-width: calc(100vw - 32px); padding: 9px 14px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--pop); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow-2); color: var(--text); font: 500 13px var(--font); opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity var(--t) var(--ease), transform var(--t-slow) var(--spring); }
.toast.on { opacity: 1; transform: none; }
.toast i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); flex: none; }

/* Obsidian spotlight: cursor glow (spotlight.js, copied from the look) */
(() => {
  const SEL = '.os-card, .os-row, [data-spot]';
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  addEventListener('pointermove', e => {
    if (e.pointerType !== 'mouse' || still.matches) return;
    const t = e.target.closest && e.target.closest(SEL);
    if (!t) return;
    const r = t.getBoundingClientRect();
    t.style.setProperty('--mx', (e.clientX - r.left) + 'px');
    t.style.setProperty('--my', (e.clientY - r.top) + 'px');
  }, { passive: true });
})();

  const keys = el.dataset.keys;
  tipEl.innerHTML = `<span>${esc(el.dataset.tip)}</span>${keys ? `<kbd>${esc(keys)}</kbd>` : ''}`;
  tipEl.classList.toggle('k', !!keys);
  const r = el.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  const x = Math.max(8, Math.min(innerWidth - tw - 8, r.left + r.width / 2 - tw / 2));
  let y = r.bottom + 6; if (y + th > innerHeight - 8) y = r.top - th - 6;
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px'; tipEl.classList.add('on');
}
function hideTip() { clearTimeout(tipT); tipFor = null; tipEl.classList.remove('on'); }
function closeDrawer() { document.querySelectorAll('.win.drawer').forEach(w => w.classList.remove('drawer')); }
/* theme follows the system; the design room can still set it through its message or the hidden hook */
const SYS = matchMedia('(prefers-color-scheme: light)');
const applyTheme = t => { root.dataset.theme = t === 'light' ? 'light' : 'dark'; };
SYS.addEventListener('change', e => applyTheme(e.matches ? 'light' : 'dark'));
addEventListener('message', e => { const m = e.data; if (m && m.type === 'design-room' && (m.theme === 'light' || m.theme === 'dark')) applyTheme(m.theme); });

/* accent picker: presets plus a full-spectrum hue slider, live preview, saved as a hue number */
const hueNow = () => Math.round(parseFloat(getComputedStyle(root).getPropertyValue('--acc-h')) || 262);
function setHue(h, save) {
  h = Math.round(((+h % 360) + 360) % 360);
  root.style.setProperty('--acc-h', String(h));
  if (save) saveHue(h);
  if (pickEl) {
    pickEl.querySelector('.pk-val').textContent = h + '°';
    pickEl.querySelectorAll('.pk-sw').forEach(b => b.setAttribute('aria-checked', +b.dataset.h === h));
    const r = pickEl.querySelector('.pk-range'); if (+r.value !== h) r.value = h;
  }
}
let pickEl = null, pickBtn = null;
function openPicker(btn) {
  if (pickEl) { closePicker(); return; }
  const win = btn.closest('.win'), host = win.querySelector('.pick-host'), h = hueNow();
  host.innerHTML = `<div class="picker" role="dialog" aria-label="Accent colour">
    <div class="pk-h"><span class="os-label">Accent</span><span class="num pk-val">${h}°</span></div>
    <div class="pk-pre" role="radiogroup" aria-label="Preset accents">${PRESETS.map(([n, v]) => `<button class="pk-sw" role="radio" aria-checked="${v === h}" data-do="acc-pre" data-h="${v}" aria-label="${n}" data-tip="${n}" style="--h: ${v}"></button>`).join('')}</div>
    <input class="pk-range" type="range" min="0" max="359" step="1" value="${h}" aria-label="Accent hue" style="--spectrum: ${SPECTRUM}">
    <div class="pk-f"><span class="pk-var"><i class="d"></i>Dark</span><span class="pk-var"><i class="l"></i>Light</span><span class="pk-note">Light uses a deeper shade</span></div>
  </div>`;
  pickEl = host.firstElementChild; pickBtn = btn; btn.setAttribute('aria-expanded', 'true');
  const wr = win.getBoundingClientRect(), br = btn.getBoundingClientRect();
  pickEl.style.right = Math.max(8, wr.right - br.right) + 'px';
  pickEl.style.top = (br.bottom - wr.top - 2) + 'px';
  const range = pickEl.querySelector('.pk-range');
  range.addEventListener('input', () => setHue(range.value, false));
  range.addEventListener('change', () => setHue(range.value, true));
}
function closePicker(refocus) {
  if (!pickEl) return false;
  pickEl.remove(); pickEl = null;
  if (pickBtn) { pickBtn.setAttribute('aria-expanded', 'false'); if (refocus) pickBtn.focus({ preventScroll: true }); }
  pickBtn = null; return true;
}

/* ---------- actions ---------- */
const ACT = {
  noop() {},
  'edit-addr': () => show('address'),
  crumb: el => { if (el.dataset.path !== S.b.path) nav(el.dataset.path); else show('address'); },
  cmenu: el => openCrumbMenu(el),
  cmore: el => openMoreMenu(el),
  go: el => { closeMenu(); nav(el.dataset.path); },
  back: () => { if (S.step === 'search') show('browse'); else histGo(-1); },
  fwd: () => histGo(1),
  up: () => { if (S.step === 'search') return show('browse'); const p = parent(S.b.path); if (p) nav(p, true, leaf(S.b.path)); },
  'addr-cancel': () => show('browse'),
  'ta-open': el => { S.ta.hi = +el.dataset.i; show('search'); },
  'search-clear': () => show('browse'),
  'q-open': el => {
    if (innerWidth > 600 || S.step !== 'browse') return;
    const tb = el.closest('.toolbar'); if (tb.classList.contains('q-open')) return;
    tb.classList.add('q-open'); el.querySelector('input').focus();
  },
  sort: el => resort(el.dataset.k),
  chip: el => { const c = el.dataset.c; S.s.chips[c] = !S.s.chips[c]; el.setAttribute('aria-pressed', S.s.chips[c]); el.querySelector('.cl').textContent = chipLabel(c); refreshSearch(true, true); },
  scope: el => { S.s.scope = el.dataset.v; el.closest('.seg').querySelectorAll('.seg-b').forEach(b => b.setAttribute('aria-checked', b === el)); placeSeg(cur()); refreshSearch(true, true); },
  'opts-clear': () => { S.s.chips = { date: false, kind: false, size: false }; S.s.scope = 'all'; render('search'); },
  copyto: () => show('copy'),
  'sel-clear': () => { S.s.sel.clear(); syncSel(); },
  'copy-close': () => show('browse'),
  pause: () => { S.cp.paused = !S.cp.paused; updFoot(cur()); drawCopy(cur()); },
  cancel: () => { S.cp.state = 'confirm'; updFoot(cur()); drawCopy(cur()); },
  'cancel-no': () => { S.cp.state = 'run'; updFoot(cur()); drawCopy(cur()); },
  'cancel-yes': () => { S.cp.state = 'stopped'; S.cp.paused = false; updFoot(cur()); drawCopy(cur()); toast('Copy stopped'); },
  cf: el => {
    const v = el.dataset.v;
    if (v === 'compare') S.cp.compare = !S.cp.compare;
    else { S.cp.conflict = v; S.cp.compare = false; }
    updConflict(cur());
    if (v === 'compare') { const b = cur().querySelector('[data-v="compare"]'); if (b) b.focus({ preventScroll: true }); }
  },
  'cf-undo': () => { S.cp.conflict = 'open'; updConflict(cur()); },
  card: el => { const c = el.dataset.c; S.closed[c] = !S.closed[c]; el.closest('.scard').classList.toggle('closed', S.closed[c]); el.setAttribute('aria-expanded', !S.closed[c]); },
  fav: el => nav(el.dataset.path),
  tab: el => { const i = +el.dataset.i; if (i === S.tab && S.step === 'browse') return; S.tab = i; S.rise = true; if (S.step === 'browse') render('browse'); else show('browse'); },
  'tab-new': () => { S.tabs.push(newB(HOME)); S.tab = S.tabs.length - 1; S.rise = true; if (S.step === 'browse') render('browse'); else show('browse'); toast(`New tab on ${leaf(HOME)}`); },
  'tab-close': el => { const i = +el.dataset.i; if (S.tabs.length < 2) return; S.tabs.splice(i, 1); if (S.tab > i || S.tab >= S.tabs.length) S.tab = Math.max(0, S.tab - 1); if (S.step === 'browse') render('browse'); else show('browse'); },
  picker: el => openPicker(el),
  'acc-pre': el => setHue(el.dataset.h, true),
  'room-theme': () => applyTheme(root.dataset.theme === 'light' ? 'dark' : 'light'),
  drawer: el => { const w = el.closest('.win'); w.classList.toggle('drawer'); },
  'ql-close': () => closeQL(),
  'ql-open': el => { closeQL(); openRow(el.dataset.key); }
};

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-do]');
  if (!el || el.disabled) { if (!e.target.closest('.menu')) closeMenu(); return; }
  const d = el.dataset.do;
  if (d !== 'cmenu' && d !== 'cmore' && !el.closest('.menu')) closeMenu();
  (ACT[d] || ACT.noop)(el, e);
});
document.addEventListener('pointerdown', e => {
  hideTip();
  if (pickEl && !e.target.closest('.picker, .acc-btn')) closePicker();
  if (e.button !== 0) return;
  if (S.step === 'address' && !e.target.closest('.addr, .titlebar, .picker')) { show('browse'); return; }
  const rowsEl = e.target.closest('.rows');
  if (!rowsEl || e.target.closest('input, button') || S.step === 'copy') return;
  const mode = modeOf(S.step), st = stFor(mode), row = e.target.closest('.row');
  if (!row) { if (!e.metaKey && !e.ctrlKey && !e.shiftKey && st.sel.size) { st.sel.clear(); st.anchor = st.cursor = null; syncSel(); } return; }
  const id = row.dataset.key;
  if (e.shiftKey && st.anchor) {
    const ids = [...rowsEl.querySelectorAll('.row')].map(r => r.dataset.key), a = ids.indexOf(st.anchor), b = ids.indexOf(id);
    st.sel = new Set(ids.slice(Math.min(a, b), Math.max(a, b) + 1));
  } else if (e.metaKey || e.ctrlKey) { if (st.sel.has(id)) st.sel.delete(id); else st.sel.add(id); st.anchor = id; }
  else { st.sel = new Set([id]); st.anchor = id; }
  st.cursor = id; syncSel();
  rowsEl.focus({ preventScroll: true });
});
document.addEventListener('dblclick', e => { const row = e.target.closest('.row'); if (row && !e.target.closest('input')) openRow(row.dataset.key); });
document.addEventListener('pointermove', e => {
  const r = e.target.closest && e.target.closest('.ta-row'); if (!r || r.classList.contains('hi')) return;
  S.ta.hi = +r.dataset.i; r.parentNode.querySelectorAll('.ta-row').forEach((x, i) => { x.classList.toggle('hi', i === S.ta.hi); x.setAttribute('aria-selected', i === S.ta.hi); });
}, { passive: true });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.classList.contains('addr-input')) { S.ta.value = t.value; S.ta.hi = 0; cur().querySelector('.ta').innerHTML = taInner(); return; }
  if (t.name === 'q' && S.step === 'search') { S.s.q = t.value; t.closest('.search').classList.toggle('has', !!t.value); refreshSearch(false, true); }
});
document.addEventListener('focusout', e => {
  hideTip();
  const t = e.target;
  if (t.name === 'q' && S.step === 'browse' && !t.value) { const tb = t.closest('.toolbar'); if (tb) tb.classList.remove('q-open'); }
});
document.addEventListener('pointerover', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el === tipFor) return; hideTip();
  if (!el || e.pointerType !== 'mouse') return;
  tipFor = el; tipT = setTimeout(() => showTip(el), 420);
});
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el && e.target.matches(':focus-visible')) { hideTip(); tipFor = el; showTip(el); } });
document.addEventListener('animationend', e => { if (e.animationName === 'os-rise') e.target.classList.remove('os-rise'); });
function taKey(e) {
  const { dir, list } = taMatches();
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault(); if (!list.length) return;
    S.ta.hi = (S.ta.hi + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
    cur().querySelectorAll('.ta-row').forEach((x, i) => { x.classList.toggle('hi', i === S.ta.hi); x.setAttribute('aria-selected', i === S.ta.hi); });
  } else if (e.key === 'Tab') {
    if (!list.length) return; e.preventDefault();
    S.ta.value = join(dir, list[S.ta.hi].name); e.target.value = S.ta.value; S.ta.hi = 0;
    cur().querySelector('.ta').innerHTML = taInner();
  } else if (e.key === 'Enter') { e.preventDefault(); show('search'); }
  else if (e.key === 'Escape') { e.preventDefault(); show('browse'); }
}
document.addEventListener('keydown', e => {
  const t = e.target, mod = e.metaKey || e.ctrlKey, k = e.key;
  if (k === 'Escape' && closePicker(true)) { e.preventDefault(); return; }
  if (t.classList && t.classList.contains('pk-range')) return;
  if (k === 'Escape' && (closeMenu() || closeQL())) { e.preventDefault(); return; }
  if (k === 'Escape' && document.querySelector('.win.drawer')) { closeDrawer(); return; }
  if (t.classList && t.classList.contains('addr-input')) return taKey(e);
  if (t.classList && t.classList.contains('rn')) return;
  if (t.name === 'q') {
    if (k === 'Enter' && S.step === 'browse') { e.preventDefault(); S.s.q = t.value.trim() || C.search.query; show('search'); }
    else if (k === 'Escape') { e.preventDefault(); if (S.step === 'search') show('browse'); else { t.value = ''; t.blur(); } }
    return;
  }
  if (t.matches && t.matches('input, textarea')) return;
  if (S.step === 'copy') { if (k === 'Escape') { e.preventDefault(); show('browse'); } return; }
  if (S.step === 'address') { if (k === 'Escape') show('browse'); return; }
  if (t.matches && t.matches('.addr[data-do]') && (k === 'Enter' || k === ' ')) { e.preventDefault(); show('address'); return; }
  if (mod && k === 'ArrowLeft') { e.preventDefault(); ACT.back(); return; }
  if (mod && k === 'ArrowRight') { e.preventDefault(); ACT.fwd(); return; }
  if (mod && k === 'ArrowUp') { e.preventDefault(); ACT.up(); return; }
  if (mod && (k === 'd' || k === 'D')) { e.preventDefault(); if (S.step === 'browse') show('address'); return; }
  if (mod && (k === 'f' || k === 'F')) { e.preventDefault(); const q = cur().querySelector('input[name="q"]'); if (q) q.focus(); return; }
  if (mod && (k === 'a' || k === 'A')) { e.preventDefault(); const mode = modeOf(S.step), st = stFor(mode); st.sel = new Set(listFor(mode).map(r => r.id)); syncSel(); return; }
  if (t.closest && t.closest('button') && (k === 'Enter' || k === ' ')) return;
  if (k === 'Escape' && S.step === 'search') { show('browse'); return; }
  if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); moveSel(k === 'ArrowDown' ? 1 : -1, e.shiftKey); return; }
  if (k === 'Home' || k === 'End') { e.preventDefault(); moveSel(k === 'Home' ? -1e6 : 1e6, e.shiftKey); return; }
  if (k === 'Enter') { const r = oneSel(); if (r) { e.preventDefault(); openRow(r.id); } return; }
  if (k === ' ') { e.preventDefault(); if (!closeQL()) openQL(oneSel()); return; }
  if (k === 'F2' && S.step === 'browse') { e.preventDefault(); rename(); }
});
let rzT = 0;
addEventListener('resize', () => { closeMenu(); closePicker(); hideTip(); clearTimeout(rzT); rzT = setTimeout(() => { const sec = cur(); fitCrumbs(sec); placeSeg(sec); if (S.step === 'copy') drawSpark(sec); }, 60); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { const sec = cur(); fitCrumbs(sec); placeSeg(sec); });

show('browse');
})();
